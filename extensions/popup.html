<!DOCTYPE html>
<html>
<head>
    <title>Emotion Analyzer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h2>Emotion Analyzer</h2>
        <div class="subtitle">Powered by DeBERTa-v3</div>
    </div>

    <div id="selection-card" class="card hidden">
        <label>Selected Text:</label>
        <div id="selectedText"></div>
    </div>
    
    <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p>Analyzing text...</p>
    </div>

    <div id="results" class="hidden">
        <label>Emotions Breakdown</label>
        <div class="chart-container">
            <canvas id="emotionChart"></canvas>
        </div>
        <div id="emotionList"></div>
    </div>

    <div id="no-selection" class="card">
        <p>No text selected.<br/><br/>Highlight text on the page and then click the extension icon to analyze.</p>
    </div>

    <script src="chart.js"></script>
    <script src="popup.js"></script>
</body>
</html>
